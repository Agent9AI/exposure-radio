[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "exposure-radio"
version = "0.6.0"
description = "Turns two Tenable exports into a verified, spoken priority briefing and a ticket-ready action card."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Agent9", email = "terry@agent9.dev" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]

[project.optional-dependencies]
# Local speech synthesis (Kokoro-82M through onnxruntime) and loudness work.
# ffmpeg must be on PATH as well. The core never imports any of these.
audio = ["onnxruntime", "numpy", "misaki[en]", "kokoro-onnx", "soundfile"]
# The opt-in analyst agent calls the Claude API through the official SDK.
agent = ["anthropic"]

[project.scripts]
exposure-radio = "exposure_radio.cli:main"

[tool.setuptools.packages.find]
include = ["exposure_radio*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
# Long lines are a formatting matter; the typing modernisations are skipped so the
# code reads the same on every supported interpreter; B904 is left to judgement.
ignore = ["E501", "UP006", "UP007", "UP035", "UP045", "B904"]
